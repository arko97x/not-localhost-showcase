<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Floral Installation View</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --text-light: #f3f4f6;
            --text-dim: #9ca3af;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Controls */
        #sidebar {
            width: 320px;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .control-group {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            background: var(--border-color);
            color: var(--text-light);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent);
        }

        .layer-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .layer-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .layer-item.active {
            border-color: var(--accent);
            background: rgba(79, 70, 229, 0.15);
        }

        .layer-item input[type="checkbox"] {
            margin-right: 12px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .layer-item .layer-name {
            font-size: 0.85rem;
            flex: 1;
        }

        /* 3D Stage Scene */
        #stage-container {
            flex: 1;
            position: relative;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e2430 0%, #0d0f12 100%);
        }

        #stage-container:active {
            cursor: grabbing;
        }

        #installation-stage {
            position: relative;
            width: 700px;
            height: 500px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .layer-plane {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer-frame {
            position: absolute;
            inset: 0;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.01);
            transition: border-color 0.3s;
        }

        .layer-plane.highlighted .layer-frame {
            border-color: var(--accent);
            background: rgba(79, 70, 229, 0.05);
        }

        .layer-plane svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.6));
        }

        /* On-Screen Helper Instructions */
        .instruction-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-dim);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>Layered Installation View</h1>
            <p>3D Depth Breakdown & Composition</p>
        </div>

        <div class="control-group">
            <label for="spread-range">
                <span>Layer Separation (Explode)</span>
                <span id="spread-val">120px</span>
            </label>
            <input type="range" id="spread-range" min="0" max="250" value="120">
            
            <div class="btn-group">
                <button id="btn-reset">Reset View</button>
                <button id="btn-side">Side View</button>
                <button id="btn-front">Front View</button>
            </div>
        </div>

        <div class="control-group">
            <label for="rotate-range">
                <span>Auto Rotation Speed</span>
                <span id="rotate-val">Off</span>
            </label>
            <input type="range" id="rotate-range" min="0" max="5" value="0" step="0.5">
        </div>

        <div class="layer-list" id="layer-list-container">
            <!-- Dynamically populated -->
        </div>
    </div>

    <div id="stage-container">
        <div id="installation-stage">
            <!-- Layers render here -->
        </div>
        <div class="instruction-overlay">
            <span>Click & Drag to rotate | Scroll to zoom</span>
        </div>
    </div>

    <script>
        // Layer Data definitions recreating elements extracted from the drawing set
        const layersData = [
            {
                id: 'layer-bg-round',
                name: '1. Background Circular Motif & Rose',
                depth: -2,
                svgContent: `
                    <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Top Circular Pattern (Lily pad/Moon base) -->
                        <circle cx="230" cy="110" r="65" stroke-dasharray="4 2" opacity="0.6"/>
                        <path d="M 180 120 Q 210 140 240 120 T 280 130" opacity="0.7"/>
                        <path d="M 190 90 Q 220 110 270 80" opacity="0.7"/>

                        <!-- Bottom Left Rose & Stem -->
                        <path d="M 100 370 Q 140 400 230 380 Q 280 350 260 280" />
                        <path d="M 100 370 C 80 350 70 310 110 290 C 150 270 170 330 110 330 Z" fill="#161a22"/>
                        <!-- Leaf details on stem -->
                        <path d="M 230 380 Q 270 420 300 380 C 290 350 260 360 230 380 Z" />
                    </g>
                `
            },
            {
                id: 'layer-bellflower',
                name: '2. Bottom Right Bellflower & Flourish',
                depth: -1,
                svgContent: `
                    <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Bellflower stem curve -->
                        <path d="M 330 200 C 400 260 480 340 470 380" />
                        <!-- Hanging Bellflower -->
                        <path d="M 430 360 L 410 410 L 440 430 L 470 430 L 490 400 L 470 360 Z" fill="#161a22"/>
                        <path d="M 410 410 L 425 435 M 440 430 L 450 445 M 470 430 L 475 445 M 490 400 L 500 420" />
                        <!-- Scroll leaf tendrils right -->
                        <path d="M 470 380 C 530 410 600 390 620 340 C 640 290 570 300 560 320" />
                        <path d="M 520 370 Q 580 330 540 280" />
                    </g>
                `
            },
            {
                id: 'layer-daisies',
                name: '3. Center Daisy Cluster & Peony',
                depth: 0,
                svgContent: `
                    <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Small Central Daisies -->
                        <g transform="translate(280, 210)">
                            <!-- Stem -->
                            <path d="M 80 120 Q 50 70 20 20" />
                            <!-- Flowers -->
                            <circle cx="20" cy="20" r="10" fill="#161a22"/>
                            <path d="M 20 5 C 10 0 10 10 20 10 C 30 10 30 0 20 5 Z M 5 20 C 0 10 10 10 10 20 Z M 35 20 C 40 10 30 10 30 20 Z M 20 35 C 10 40 10 30 20 30 Z" />
                            
                            <circle cx="60" cy="50" r="12" fill="#161a22"/>
                            <circle cx="10" cy="80" r="9" fill="#161a22"/>
                            <circle cx="80" cy="100" r="11" fill="#161a22"/>
                        </g>

                        <!-- Right isolated Peony blossom -->
                        <g transform="translate(480, 220)">
                            <circle cx="25" cy="25" r="22" fill="#161a22" stroke-dasharray="3 1"/>
                            <circle cx="25" cy="25" r="14" />
                            <circle cx="25" cy="25" r="6" />
                        </g>
                    </g>
                `
            },
            {
                id: 'layer-chrysanthemum',
                name: '4. Center-Left Chrysanthemum Stems',
                depth: 1,
                svgContent: `
                    <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <g transform="translate(180, 80)">
                            <!-- Tall Twin Stems -->
                            <path d="M 80 280 C 20 200 130 100 110 20" />
                            <path d="M 110 280 C 50 210 170 120 150 0" />
                            <!-- Top Chrysanthemum Head -->
                            <circle cx="150" cy="0" r="28" fill="#161a22"/>
                            <path d="M 130 -15 C 140 -30 160 -30 170 -15 C 180 0 160 10 150 0 Z" />
                            <!-- Leaves along stem -->
                            <path d="M 90 150 C 60 130 50 160 80 180 Z" fill="#161a22"/>
                            <path d="M 130 100 C 170 80 170 110 140 120 Z" fill="#161a22"/>
                        </g>
                    </g>
                `
            },
            {
                id: 'layer-top-lotus',
                name: '5. Top Left Lotus & Main Swirls',
                depth: 2,
                svgContent: `
                    <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <!-- Top Left Lotus Blossom -->
                        <g transform="translate(230, 80)">
                            <path d="M 0 0 C -30 -30 30 -60 0 -80 C -30 -60 30 -30 0 0 Z" fill="#161a22"/>
                            <ellipse cx="0" cy="-40" rx="15" ry="8" />
                        </g>
                        
                        <!-- Dominant Acanthus Leaf Swirls (Front) -->
                        <path d="M 80 180 C 20 280 120 380 180 430 Q 260 480 320 440" />
                        <path d="M 500 60 C 430 120 370 240 450 350 C 510 430 620 380 650 300" />
                        
                        <!-- Leaf serrations -->
                        <path d="M 60 220 L 40 200 L 70 240 L 45 250 L 80 280" fill="#161a22"/>
                        <path d="M 550 100 L 580 90 L 540 130 L 585 135 L 530 170" fill="#161a22"/>
                    </g>
                `
            }
        ];

        // State variables
        let spreadDistance = 120;
        let rotX = 20;
        let rotY = -30;
        let zoom = 1;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let autoRotateSpeed = 0;
        let activeHoverLayer = null;

        // DOM Elements
        const stageContainer = document.getElementById('stage-container');
        const stage = document.getElementById('installation-stage');
        const spreadRange = document.getElementById('spread-range');
        const spreadVal = document.getElementById('spread-val');
        const rotateRange = document.getElementById('rotate-range');
        const rotateVal = document.getElementById('rotate-val');
        const layerListContainer = document.getElementById('layer-list-container');
        const btnReset = document.getElementById('btn-reset');
        const btnSide = document.getElementById('btn-side');
        const btnFront = document.getElementById('btn-front');

        // Initialize 3D Scene
        function initScene() {
            stage.innerHTML = '';
            layerListContainer.innerHTML = '';

            layersData.forEach((layer, index) => {
                // Create 3D Layer Element
                const plane = document.createElement('div');
                plane.className = 'layer-plane';
                plane.id = `plane-${layer.id}`;
                plane.dataset.index = index;

                plane.innerHTML = `
                    <div class="layer-frame"></div>
                    <svg viewBox="0 0 700 500">
                        ${layer.svgContent}
                    </svg>
                `;

                stage.appendChild(plane);

                // Create Sidebar Control Item
                const item = document.createElement('div');
                item.className = 'layer-item active';
                item.dataset.index = index;
                item.innerHTML = `
                    <input type="checkbox" checked id="chk-${layer.id}">
                    <span class="layer-name">${layer.name}</span>
                `;

                // Sidebar Events
                const chk = item.querySelector('input');
                chk.addEventListener('change', (e) => {
                    plane.style.display = e.target.checked ? 'flex' : 'none';
                });

                item.addEventListener('mouseenter', () => {
                    plane.classList.add('highlighted');
                });

                item.addEventListener('mouseleave', () => {
                    plane.classList.remove('highlighted');
                });

                layerListContainer.appendChild(item);
            });

            updateStageTransform();
            updateLayerPositions();
        }

        // Render Transforms
        function updateStageTransform() {
            stage.style.transform = `scale(${zoom}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        function updateLayerPositions() {
            const planes = document.querySelectorAll('.layer-plane');
            planes.forEach((plane) => {
                const index = parseInt(plane.dataset.index);
                const depthOffset = (index - (layersData.length - 1) / 2) * spreadDistance;
                plane.style.transform = `translateZ(${depthOffset}px)`;
            });
        }

        // Interaction Handlers
        spreadRange.addEventListener('input', (e) => {
            spreadDistance = parseInt(e.target.value);
            spreadVal.textContent = `${spreadDistance}px`;
            updateLayerPositions();
        });

        rotateRange.addEventListener('input', (e) => {
            autoRotateSpeed = parseFloat(e.target.value);
            rotateVal.textContent = autoRotateSpeed > 0 ? `${autoRotateSpeed}x` : 'Off';
        });

        // Orbit Drag Control
        stageContainer.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;

            rotY += deltaX * 0.4;
            rotX -= deltaY * 0.4;

            // Clamp X rotation to avoid flipping
            rotX = Math.max(-85, Math.min(85, rotX));

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            updateStageTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Zoom Control
        stageContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom += e.deltaY * -0.001;
            zoom = Math.max(0.4, Math.min(2.5, zoom));
            updateStageTransform();
        }, { passive: false });

        // Preset View Buttons
        btnReset.addEventListener('click', () => {
            rotX = 20;
            rotY = -30;
            zoom = 1;
            spreadDistance = 120;
            spreadRange.value = 120;
            spreadVal.textContent = '120px';
            updateStageTransform();
            updateLayerPositions();
        });

        btnSide.addEventListener('click', () => {
            rotX = 5;
            rotY = -75;
            updateStageTransform();
        });

        btnFront.addEventListener('click', () => {
            rotX = 0;
            rotY = 0;
            updateStageTransform();
        });

        // Animation Loop for Auto-Rotation
        function animate() {
            if (autoRotateSpeed > 0 && !isDragging) {
                rotY += autoRotateSpeed * 0.5;
                updateStageTransform();
            }
            requestAnimationFrame(animate);
        }

        // Initialize on load
        initScene();
        animate();
    </script>
</body>
</html>
